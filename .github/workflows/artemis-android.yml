name: Artemis Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'artemis-android/**'
      - '.github/workflows/artemis-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile llama.cpp CLI for Android arm64
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=OFF -DGGML_OPENMP=OFF
          cmake --build /tmp/llama-android -j 2
          find /tmp/llama-android -type f -name llama-cli -print
          mkdir -p artemis-android/app/src/main/jniLibs/arm64-v8a
          cp /tmp/llama-android/bin/llama-cli artemis-android/app/src/main/jniLibs/arm64-v8a/libartemis_cli.so
      - name: Build debug APK
        working-directory: artemis-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: artemis-debug-apk
          path: artemis-android/app/build/outputs/apk/debug/app-debug.apk
