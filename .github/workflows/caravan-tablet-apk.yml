name: Caravan OS Tablet APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'caravan-tablet/**'
      - '.github/workflows/caravan-tablet-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: caravan-tablet
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CaravanOS-Android10-debug
          path: caravan-tablet/app/build/outputs/apk/debug/app-debug.apk
