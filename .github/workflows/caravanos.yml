name: Build CaravanOS APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CaravanOS/**'
      - '.github/workflows/caravanos.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: CaravanOS
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CaravanOS-debug-apk
          path: CaravanOS/app/build/outputs/apk/debug/*.apk
