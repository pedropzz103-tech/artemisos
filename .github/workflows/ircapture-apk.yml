name: IR Capture Android APK
on:
  push:
    branches:
      - build/ircapture-android
    paths:
      - 'IRCapture/**'
      - '.github/workflows/ircapture-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          echo "Android SDK at $ANDROID_HOME"
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p IRCapture :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IRCapture-debug-apk
          path: IRCapture/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
