<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Caravan OS</title><style>
*{box-sizing:border-box}body{margin:0;background:#020713;color:#e8f7ff;font:16px Arial,sans-serif}#app{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#030b18}#art{position:absolute;width:100%;height:100%;object-fit:fill;inset:0}button{cursor:pointer} .hit{position:absolute;background:transparent;border:0;border-radius:18px;color:transparent} .hit:active{background:#36c8ff55}.panel{position:absolute;inset:8% 5% 14%;border:1px solid #4bb8f7aa;border-radius:24px;background:linear-gradient(135deg,#08172df5,#051124f7);padding:4%;box-shadow:0 0 50px #008cff77;overflow:auto;display:none}.panel.show{display:block}.panel h1{font-size:clamp(24px,4vw,42px);margin:0 0 24px;color:#a8e8ff}.back{float:right;color:#bceaff;background:#123555;border:1px solid #49b4ff;border-radius:12px;padding:12px 18px}.card{padding:18px;margin:10px 0;background:#102844;border:1px solid #285c85;border-radius:14px}.card button{float:right;border:1px solid #69ceff;border-radius:10px;background:#17466c;color:white;padding:10px}.on{border-color:#4fffe3!important;background:#175b60!important}#msg{color:#9ac5e5;margin-top:25px;font-size:14px}
</style><div id="app"><img id="art" src="caravan-background.jpg" alt="Caravan OS"><div id="hits"></div><div class="panel" id="panel"><button class="back" onclick="openTab('inicio')">← Início</button><h1 id="title"></h1><div id="content"></div><p id="msg">Conectando ao ESP32...</p></div></div>
<script>
const tabs=['inicio','navegacao','musica','eve','cameras','ajustes','sistema'];
const labels=['INÍCIO','NAVEGAÇÃO','MÚSICA','EVE','CÂMERAS','AJUSTES','SISTEMA'];
// Coordinates normalized against the supplied 1536×864 reference artwork.
const areas=[[.032,.858,.128,.114],[.169,.858,.124,.114],[.306,.858,.123,.114],[.439,.858,.122,.114],[.574,.858,.125,.114],[.708,.858,.124,.114],[.844,.858,.128,.114]];
const side=[['Sala',0,.022,.215,.145,.13],['Quarto',1,.022,.354,.145,.13],['Cozinha',2,.022,.495,.145,.13],['Externa',3,.022,.637,.145,.13],['Alarme',-1,.836,.215,.147,.13]];
const hits=document.getElementById('hits'),panel=document.getElementById('panel'),content=document.getElementById('content');
function addHit(x,y,w,h,fn,label){let b=document.createElement('button');b.className='hit';b.setAttribute('aria-label',label);Object.assign(b.style,{left:x*100+'%',top:y*100+'%',width:w*100+'%',height:h*100+'%'});b.onclick=fn;hits.appendChild(b)}
areas.forEach((a,i)=>addHit(...a,()=>openTab(tabs[i]),labels[i]));
side.forEach(([n,i,x,y,w,h])=>addHit(x,y,w,h,()=>i<0?toggleAlarm():toggleLight(i),n));
let state={lights:[false,false,false,false,false],alarm:false},online=false;
async function api(path,method='GET'){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),2000);try{let r=await fetch(path,{method,signal:controller.signal,cache:'no-store'});if(!r.ok)throw Error(r.status);return await r.json()}finally{clearTimeout(timer)}}
async function refresh(){try{state=await api('/api/state');online=true}catch(e){online=false}document.getElementById('msg').textContent=online?'ESP32 conectado':'ESP32 desconectado';if(panel.classList.contains('show'))render()}
async function toggleLight(i){if(!online)return;try{state=await api('/api/light?id='+i,'POST')}catch(e){online=false}render()}
async function toggleAlarm(){if(!online)return;try{state=await api('/api/alarm','POST')}catch(e){online=false}render()}
let current='inicio';
function openTab(t){current=t;panel.classList.toggle('show',t!=='inicio');render()}
function render(){document.getElementById('title').textContent=labels[tabs.indexOf(current)];const cards=(items)=>items.map(x=>'<div class="card">'+x+'</div>').join('');let html='';
switch(current){
case 'sistema':html=cards(['ESP32: '+(online?'Conectado':'Desconectado'),'Rede local: CaravanOS','API: /api/state']);break;
case 'ajustes':html=cards(['Interface hospedada no ESP32','Controles demonstrativos: sem relés físicos','Configurações avançadas: em desenvolvimento']);break;
case 'cameras':html=cards(['Câmeras: integração futura']);break;
case 'navegacao':html=cards(['Navegação offline: integração futura']);break;
case 'musica':html=cards(['Música: integração futura']);break;
case 'eve':html=cards(['Eve: integração com iPhone futura']);break;
default:html=cards(['Toque nas luzes e no alarme na tela inicial.']);}
if(current==='sistema')html+=cards(['Alarme: '+(state.alarm?'Armado':'Desarmado'),...state.lights.map((v,i)=>['Corredor','Banheiro','Sala','Cozinha','Quarto'][i]+': '+(v?'Ligada':'Desligada'))]);
content.innerHTML=html}
refresh();setInterval(refresh,4000);
</script></html>
