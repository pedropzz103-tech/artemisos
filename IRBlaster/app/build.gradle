plugins { id 'com.android.application' }

android {
    namespace 'one.visione.irblaster'
    compileSdk 35

    defaultConfig {
        applicationId 'one.visione.irblaster'
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
